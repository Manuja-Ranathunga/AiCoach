services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicoach
      POSTGRES_PASSWORD: aicoach
      POSTGRES_DB: aicoach
    ports:
      - "5432:5432"
    volumes:
      - aicoach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicoach -d aicoach"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://aicoach:aicoach@db:5432/aicoach
      JWT_SECRET_KEY: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./apps/frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:4173"
    depends_on:
      - backend

volumes:
  aicoach_pgdata:
