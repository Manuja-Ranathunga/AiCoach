services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formspotter
      POSTGRES_PASSWORD: formspotter
      POSTGRES_DB: formspotter
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formspotter -d formspotter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
