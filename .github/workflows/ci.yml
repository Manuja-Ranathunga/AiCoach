name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/frontend

  ml-engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=packages/ml-engine

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicoach
          POSTGRES_PASSWORD: aicoach
          POSTGRES_DB: aicoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aicoach"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://aicoach:aicoach@localhost:5432/aicoach
      JWT_SECRET_KEY: ci-test-secret
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: pytest
